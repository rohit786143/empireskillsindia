name: Auto Deploy to Hostinger (empireskillsindia.com)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Static Site & PHP API to Hostinger
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Prepare clean deploy folder (preserving live config.php)
        run: |
          mkdir -p deploy
          cp -r out/. deploy/
          mkdir -p deploy/php-api
          cp -r php-api/. deploy/php-api/
          rm -f deploy/php-api/config.php

      - name: Mirror files to Hostinger public_html via lftp
        env:
          RAW_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          CLEAN_HOST=$(echo "$RAW_SERVER" | sed -E 's#^[a-zA-Z]+://##; s#/.*$##; s#[[:space:]]##g')

          ROOT_LIST=$(lftp -u "$FTP_USER","$FTP_PASS" "$CLEAN_HOST" -e "set ssl:verify-certificate no; set ftp:passive-mode true; set net:max-retries 2; cls -1; bye" 2>/dev/null || true)
          echo "FTP root entries:"
          echo "$ROOT_LIST"

          TARGET_DIR="."
          if echo "$ROOT_LIST" | grep -qxE "php-api/?"; then
            TARGET_DIR="."
          elif echo "$ROOT_LIST" | grep -qxE "domains/?"; then
            TARGET_DIR="domains/empireskillsindia.com/public_html"
          elif echo "$ROOT_LIST" | grep -qxE "public_html/?"; then
            TARGET_DIR="public_html"
          fi
          echo "Deploying into Hostinger directory: $TARGET_DIR"

          lftp -u "$FTP_USER","$FTP_PASS" "$CLEAN_HOST" <<EOF
          set ssl:verify-certificate no
          set ftp:passive-mode true
          set net:timeout 30
          set net:max-retries 4
          set net:reconnect-interval-base 3
          mirror --reverse --parallel=2 --overwrite --exclude ^php-api/config\.php$ --exclude ^\.git ./deploy "$TARGET_DIR"
          bye
          EOF
