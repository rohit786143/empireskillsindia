<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — Empire Skills India</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0B3D62, #0E5E74);
      font-family: system-ui, -apple-system, sans-serif;
      color: #1E293B;
      padding: 20px;
    }
    .card {
      background: #fff;
      border-top: 5px solid #F07228;
      border-radius: 16px;
      max-width: 380px;
      width: 100%;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.25);
    }
    img { height: 52px; margin-bottom: 16px; }
    h1 { font-size: 20px; color: #0B3D62; margin: 0 0 8px; }
    p { font-size: 13px; color: #475569; line-height: 1.5; margin: 0 0 20px; }
    button {
      background: #F07228;
      color: #fff;
      border: 0;
      border-radius: 8px;
      padding: 11px 24px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="/empire-logo.png" alt="Empire Skills India" />
    <h1>No Internet Connection</h1>
    <p>Please check your mobile data or Wi-Fi connection and tap retry to open Empire Skills India.</p>
    <button onclick="window.location.reload()">Try Again</button>
  </div>
</body>
</html>
